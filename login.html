<!doctype html><html lang="en"><head><title>Sign in — Try AI GPT</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/auth.css"></head>
<body><section class="panel" style="min-height:100vh;background:var(--bg)"><div class="box card" style="padding:32px">

</div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script></body></html>
