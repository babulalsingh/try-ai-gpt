<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reset password — Try AI GPT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/auth.css"></head>
<body><section class="panel" style="min-height:100vh;background:var(--bg)"><div class="box card" style="padding:32px">
  <a class="logo" href="index.html" style="justify-content:center"><i></i>Try AI <b>GPT</b></a>

  </form>

</div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="assets/js/config.js"></script><script src="assets/js/auth.js"></script></body></html>
